
server.port=8080

weather.primary-provider=openweather
weather.secondary-provider=open-meteo
weather.openweather.base-url=https://api.openweathermap.org/data/2.5
weather.openweather.api-key=${OPENWEATHER_API_KEY:demo-key}
weather.openmeteo.base-url=https://api.open-meteo.com/v1
weather.fallback.enabled=true
weather.circuit-breaker.sliding-window-size=10
weather.circuit-breaker.minimum-number-of-calls=5
weather.circuit-breaker.failure-rate-threshold=50
weather.circuit-breaker.wait-duration-in-open-state=30s
weather.circuit-breaker.permitted-calls-in-half-open-state=2
